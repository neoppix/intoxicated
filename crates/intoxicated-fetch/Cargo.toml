[package]
name = "intoxicated-fetch"
description = "Fetches the newest Roblox Android build from APKPure and verifies its APK signature against pinned certificates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "intoxicated-fetch"
path = "src/main.rs"

[dependencies]
# HTTP over rustls only (no gzip: byte counts must be the file's bytes).
ureq.workspace = true
# RSA PKCS#1 v1.5 and PSS verification at any size from 1024 bits up.
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit"] }
sha2 = { version = "0.10", features = ["oid"] }
sha1 = "0.10"
# Already in the tree through rustls; used here for ECDSA P-256 / P-384.
ring = "0.17"
serde_json = "1"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
